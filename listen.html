<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeamMind 音频讲解</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 50%, #0ea5e9 100%);
      color: #f8fafc;
    }
    main {
      width: min(480px, 100%);
      padding: 32px 28px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 24px; line-height: 1.6; }
    audio {
      width: 100%;
      margin-bottom: 16px;
    }
    .hint { font-size: 0.8rem; color: #94a3b8; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>TeamMind 音频讲解</h1>
    <p>点击下方播放按钮即可收听，无需下载文件。</p>
    <audio controls preload="metadata" src="https://raw.githubusercontent.com/FrankDengAI/TeamMind_AI/main/%E9%9F%B3%E9%A2%91%E8%AE%B2%E8%A7%A3.mp3">
      您的浏览器不支持音频播放，请
      <a href="https://raw.githubusercontent.com/FrankDengAI/TeamMind_AI/main/%E9%9F%B3%E9%A2%91%E8%AE%B2%E8%A7%A3.mp3">下载音频</a>。
    </audio>
    <p class="hint">组队超脑 TeamMind AI</p>
  </main>
</body>
</html>
