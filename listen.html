<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeamMind 音频讲解</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 50%, #0ea5e9 100%);
      color: #f8fafc;
    }
    main {
      width: min(480px, 100%);
      padding: 32px 28px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 24px; line-height: 1.6; }
    audio { width: 100%; margin-bottom: 16px; }
    .err {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(248, 113, 113, 0.5);
      font-size: 0.85rem;
      color: #fecaca;
      text-align: left;
      line-height: 1.5;
    }
    .err.show { display: block; }
    .hint { font-size: 0.8rem; color: #94a3b8; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>TeamMind 音频讲解</h1>
    <p>点击下方播放按钮即可收听（音频与页面同一站点，避免跨域无法播放）。</p>
    <!--
      二维码请仍指向本页（地址不变）：
      https://frankdengai.github.io/TeamMind_AI/listen.html

      音频文件路径与原先一致，仅后缀 mp3 → m4a：
      - Pages 同源：audio-intro.m4a（原 audio-intro.mp3）
      - GitHub Raw：…/音频讲解.m4a（原 …/音频讲解.mp3）
    -->
    <audio id="player" controls preload="metadata"></audio>
    <div id="err" class="err"></div>
    <p class="hint">组队超脑 TeamMind AI</p>
  </main>
  <script>
    const player = document.getElementById('player')
    const err = document.getElementById('err')
    // 与原先相同的链接结构，仅扩展名改为 m4a
    const AUDIO_SOURCES = [
      'audio-intro.m4a',
      '%E9%9F%B3%E9%A2%91%E8%AE%B2%E8%A7%A3.m4a',
      'https://raw.githubusercontent.com/FrankDengAI/TeamMind_AI/main/%E9%9F%B3%E9%A2%91%E8%AE%B2%E8%A7%A3.m4a',
    ]
    const rawDownload = AUDIO_SOURCES[AUDIO_SOURCES.length - 1]
    let sourceIndex = 0

    function showErr(msg) {
      err.innerHTML = msg
      err.classList.add('show')
    }

    function loadSource(index) {
      sourceIndex = index
      err.classList.remove('show')
      player.src = AUDIO_SOURCES[index]
      player.load()
    }

    player.addEventListener('error', function () {
      if (sourceIndex + 1 < AUDIO_SOURCES.length) {
        loadSource(sourceIndex + 1)
        return
      }
      showErr(
        '无法加载音频。请确认仓库已上传 <code>audio-intro.m4a</code> 或 <code>音频讲解.m4a</code>（原 mp3 同名改后缀即可）。<br>' +
        '二维码链接仍用 <code>listen.html</code>，无需更换页面地址。<br>' +
        '也可 <a href="' + rawDownload + '">直接下载音频</a>（原 raw 链接，现为 .m4a）。'
      )
    })

    loadSource(0)
  </script>
</body>
</html>
