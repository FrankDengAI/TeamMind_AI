<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TeamMind AI hero preview</title>
  <desc id="desc">Product preview banner for TeamMind AI / 组队超脑.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1160" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1120" cy="120" r="180" fill="#22D3EE" opacity="0.13"/>
  <circle cx="180" cy="550" r="220" fill="#8B5CF6" opacity="0.14"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="1140" height="496" rx="30" fill="#020617" fill-opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="96" y="98" width="1088" height="444" rx="24" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.16"/>
  </g>
  <g transform="translate(132 140)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#22D3EE" fill-opacity="0.16" stroke="#67E8F9" stroke-opacity="0.5"/>
    <text x="75" y="22" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">AI TEAMING</text>
    <text x="0" y="88" font-family="Microsoft YaHei, Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF">组队超脑</text>
    <text x="0" y="132" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#C4B5FD">TeamMind AI</text>
    <text x="0" y="176" font-family="Microsoft YaHei, Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#E0F2FE">AI 智能组队与任务匹配协作平台</text>
    <text x="0" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#CBD5E1">Profile intelligence · Explainable grouping · Task matching · Live analytics</text>
    <text x="0" y="246" font-family="Microsoft YaHei, Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#CBD5E1">学生画像 · 智能组队 · 任务匹配 · 过程看板</text>
  </g>
  <g transform="translate(770 126)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="378" rx="26" fill="#0B1220" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="180" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Collaboration Command Center</text>
    <text x="180" y="84" text-anchor="middle" font-family="Microsoft YaHei, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#94A3B8">教师指挥台 · 学生协作舱</text>
    <text x="120" y="156" font-family="Microsoft YaHei, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">画像采集</text>
    <text x="120" y="216" font-family="Microsoft YaHei, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">智能组队</text>
    <text x="120" y="276" font-family="Microsoft YaHei, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">任务匹配</text>
    <rect x="24" y="312" width="312" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="24" y="312" width="248" height="28" rx="14" fill="url(#cyan)"/>
    <text x="40" y="331" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Team balance score 92%</text>
  </g>
</svg>
