<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>组队超脑 · 管理后台 | TeamMind Admin</title>
  <meta name="description" content="组队超脑（TeamMind Admin）教师端：班级、组队活动、任务分配与课堂看板。" />
  <meta name="application-name" content="组队超脑" />
  <meta name="theme-color" content="#0ea5e9" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/element-plus/2.8.0/index.min.css" />
  <link rel="stylesheet" href="assets/style.css?v=4.6" />
  <style>
    #app-loading {
      position: fixed; inset: 0; z-index: 99999;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 20% 16%, rgba(14,165,233,.22), transparent 30%),
        radial-gradient(circle at 82% 12%, rgba(124,58,237,.18), transparent 28%),
        linear-gradient(135deg, #f8fafc 0%, #eef6ff 48%, #f5f3ff 100%);
      color: #0f172a;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    .boot-card {
      width: min(520px, 100%);
      padding: 34px;
      border: 1px solid rgba(14,165,233,.18);
      border-radius: 28px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 24px 80px rgba(15,23,42,.14);
      backdrop-filter: blur(18px);
    }
    .boot-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 20px;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, #0ea5e9, #7c3aed);
      box-shadow: 0 16px 34px rgba(14,165,233,.28);
    }
    .boot-kicker {
      margin: 0 0 8px;
      color: #0284c7;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .boot-card h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.18;
      letter-spacing: -.03em;
    }
    .boot-subtitle {
      margin: 0 0 24px;
      color: #64748b;
      line-height: 1.7;
    }
    .boot-progress {
      height: 10px;
      overflow: hidden;
      margin-bottom: 22px;
      border-radius: 999px;
      background: #e0f2fe;
    }
    .boot-progress span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0ea5e9, #7c3aed, #06b6d4);
      animation: boot-progress 1.25s ease-in-out infinite alternate;
    }
    .boot-steps {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }
    .boot-step {
      display: flex;
      gap: 10px;
      align-items: center;
      color: #334155;
      font-size: 14px;
    }
    .boot-step b {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 999px;
      color: #0369a1;
      background: #e0f2fe;
      font-size: 12px;
    }
    .boot-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0284c7;
      font-size: 13px;
      font-weight: 800;
    }
    .boot-pulse {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,.42);
      animation: boot-pulse 1.2s infinite;
    }
    @keyframes boot-progress {
      from { transform: translateX(-28%); }
      to { transform: translateX(168%); }
    }
    @keyframes boot-pulse {
      70% { box-shadow: 0 0 0 12px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
  </style>
</head>
<body>
  <div id="admin-overview" style="display:none" aria-hidden="true"></div>
  <div id="app">
    <div id="app-loading" aria-live="polite">
      <section class="boot-card">
        <div class="boot-mark">?</div>
        <p class="boot-kicker">组队超脑 Classroom Runtime</p>
        <h1>正在进入教师课堂指挥舱</h1>
        <p class="boot-subtitle">正在为你准备本次课堂项目工作台，请稍候。</p>
        <div class="boot-progress"><span></span></div>
        <div class="boot-steps">
          <div class="boot-step"><b>01</b><span>连接本地课堂服务与权限会话</span></div>
          <div class="boot-step"><b>02</b><span>读取班级、学生画像与组队活动数据库</span></div>
          <div class="boot-step"><b>03</b><span>同步任务看板、风险预警和 AI 分组分析</span></div>
          <div class="boot-step"><b>04</b><span>装载教师管理界面与实时课堂视图</span></div>
        </div>
        <div class="boot-foot"><span class="boot-pulse"></span><strong>初始化完成后将自动打开工作台</strong></div>
      </section>
    </div>
  </div>
  <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.38/vue.global.min.js"></script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.js"><\/script>');
    }
  </script>
  <script src="https://cdn.bootcdn.net/ajax/libs/element-plus/2.8.0/index.full.min.js"></script>
  <script>
    if (typeof ElementPlus === 'undefined') {
      document.write('<script src="https://unpkg.com/element-plus@2.8.0/dist/index.full.min.js"><\/script>');
    }
  </script>
  <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.7.4/axios.min.js"></script>
  <script>
    if (typeof axios === 'undefined') {
      document.write('<script src="https://unpkg.com/axios@1.7.4/dist/axios.min.js"><\/script>');
    }
  </script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js?v=5.0"></script>
</body>
</html>
